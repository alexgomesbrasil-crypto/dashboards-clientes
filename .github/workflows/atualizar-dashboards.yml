name: Atualizar dashboards

on:
  schedule:
    - cron: "0 4 * * 1,3,5"   # 01:00 em Fortaleza (UTC-3): segunda, quarta e sexta
  workflow_dispatch:           # botão "Run workflow" quando quiser rodar na hora

permissions:
  contents: write

concurrency:
  group: atualizar-dashboards
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Baixar dados do Windsor.ai
        env:
          WINDSOR_API_KEY: ${{ secrets.WINDSOR_API_KEY }}
        run: python3 scripts/fetch_windsor.py --out /tmp/wd

      - name: "Gerar data.json (Imperial Ville fica de fora, Meta via Claude)"
        run: |
          set -e
          source /tmp/wd/period.env
          W=/tmp/wd
          python3 scripts/build_data.py --start $START --end $END --google $W/google.json --meta-windsor 1501891061337822=$W/meta_debora.json
          python3 scripts/build_keywords.py --start $START --end $END --kw $W/kw.json --termos $W/termos.json
          python3 scripts/build_publico.py --start $START --end $END --idade $W/pub_idade.json --genero $W/pub_genero.json --renda $W/pub_renda.json --dispositivo $W/pub_disp.json --cidade $W/pub_cidade.json
          python3 scripts/build_ga.py --property 558741151 --start $START --end $END --canal $W/ga_canal.json --leads $W/ga_leads.json --local $W/ga_local.json --leads-local $W/ga_leads_local.json --paginas $W/ga_paginas.json
          python3 scripts/build_ga.py --property 562081470 --start $START --end $END --canal $W/gam_canal.json --leads $W/gam_leads.json --local $W/gam_local.json --leads-local $W/gam_leads_local.json --paginas $W/gam_paginas.json
          python3 scripts/build_ga.py --property 500740125 --start $START --end $END --canal $W/gad_canal.json --leads $W/gad_leads.json --local $W/gad_local.json --leads-local $W/gad_leads_local.json

      - name: Publicar
        run: |
          set -e
          source /tmp/wd/period.env
          git config user.name "Alex Furtado"
          git config user.email "alexgomesbrasil@gmail.com"
          git add */data.json
          if git diff --cached --quiet; then echo "Sem mudanças."; exit 0; fi
          git commit -m "Atualizar dados (automático) até $END"
          git pull --rebase origin main
          git push origin HEAD:main
